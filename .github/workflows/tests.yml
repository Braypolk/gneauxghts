name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-and-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Replay agent verification regressions
        run: pnpm agent:test
      - name: Upload agent replay failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-verification-failures
          path: e2e/agent/.wdio/failures/
          include-hidden-files: true
          if-no-files-found: ignore
      - run: python3 -W error::ResourceWarning -m unittest discover -s scripts/tests -p 'test_*.py' -v
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test --manifest-path src-tauri/Cargo.toml --test architecture_fitness
