[package]
name = "gneauxghts"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gneauxghts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
e2e-wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-keyring-store = { version = "=0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1.5"
sha2 = "0.10"
hnswlib-rs = "0.10"
leiden-rs = { version = "0.8.1", default-features = false, features = ["rayon"] }
ndarray = "0.17"
rayon = "1.10"
umap-rs = "0.4.5"
tantivy = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"
rig-core = { version = "=0.41.0", default-features = false, features = ["derive", "reqwest", "rustls"] }
rig-agent = { version = "=0.41.0", default-features = false }
thiserror = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
rig-core = { version = "=0.41.0", default-features = false, features = ["test-utils"] }
rig-agent = { version = "=0.41.0", default-features = false, features = ["test-utils"] }

[patch.crates-io]
corenn-kernels = { path = "vendor/corenn-kernels" }
