[package]
name = "gneauxghts"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gneauxghts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Cargo's macOS default keeps debug info in loose object files, which accumulate
# on each incremental rebuild. Pack symbols into replaceable .dSYM bundles.
# The test profile inherits this; keep full debug info and incremental builds.
[profile.dev]
split-debuginfo = "packed"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
default = []
e2e-wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
# Debug-only loopback endpoint for native OpenAI protocol fixture tests.
e2e-chat-fixture = []

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-wdio = { version = "1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-keyring-store = { version = "=0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
blake3 = "1.5"
getrandom = "0.4.3"
sha2 = "0.11.1"
hex = "0.4.3"
libloading = "0.9.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
hnswlib-rs = "0.10"
leiden-rs = { version = "0.8.1", default-features = false, features = ["rayon"] }
ndarray = "0.17"
rayon = "1.10"
umap-rs = "0.4.5"
tantivy = "0.27"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
similar = { version = "3.2", default-features = false, features = ["bytes", "std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
zstd = "0.14.3"
notify = "8.2"
thiserror = "2"
url = "2"
percent-encoding = "2"
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde_yaml = { version = "0.10", package = "serde_yaml_ng" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSApplication", "NSImage"] }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString", "NSUserDefaults", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }
block2 = "0.6.2"
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tauri = { version = "2.12.5", features = ["test"] }

[patch.crates-io]
corenn-kernels = { path = "vendor/corenn-kernels" }
