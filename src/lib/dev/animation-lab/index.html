<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gneauxghts · Animation lab</title><link rel="stylesheet" href="/src/lib/dev/animation-lab/panel.css"></head>
<body>
  <header><a class="brand" href="/__animation-lab/" aria-label="Animation lab home"><span class="mark">g.</span><strong>Motion</strong></a><div class="transition-picker"><button id="previous-case" aria-label="Previous transition">‹</button><select id="cases" aria-label="Transition"></select><button id="next-case" aria-label="Next transition">›</button></div><button id="focus-preview" aria-expanded="false" aria-controls="inspector">Settings</button><button id="inventory" class="quiet">Inventory</button></header>
  <div class="workbench">
    <main>
      <div class="preview-toolbar"><div class="view-controls"><label class="sr-only" for="viewport">Viewport</label><select id="viewport"><option value="1440,900">Desktop · 1440 × 900</option><option value="900,850">Split · 900 × 850</option><option value="720,844">720 × 844</option><option value="700,844">700 × 844</option><option value="640,844">640 × 844</option><option value="639,844">639 × 844</option><option value="390,844">Phone · 390 × 844</option><option value="1440,500">Short · 1440 × 500</option><option value="1920,1080">Wide · 1920 × 1080</option><option value="custom" hidden>Custom</option></select><label class="check"><input type="checkbox" id="actual-size">100%</label><span id="scale"></span></div><div class="preview-actions"><button id="live-mode" title="Open an interactive workspace">Interact</button><button id="replay-live" title="Replay using the normal clock">Live replay</button><button id="run" class="primary">Record</button></div></div>
      <div id="stage"><div id="frame-wrap"><iframe id="live" title="Live workspace"></iframe><iframe id="recording" title="Recorded animation frames" sandbox="allow-same-origin"></iframe></div><div id="status" role="status">Loading…</div></div>
      <div class="transport"><button id="play" aria-label="Play recording">▶</button><button id="previous" aria-label="Previous frame">‹</button><button id="next" aria-label="Next frame">›</button><input id="timeline" type="range" min="0" max="1" value="0" aria-label="Animation timeline"><output id="time">0 ms</output><select id="speed" aria-label="Playback speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select><label class="check"><input id="loop" type="checkbox" checked>Loop</label></div>
      <div class="preview-footer"><span id="case-status" role="status"></span><div class="compare-actions"><button id="pin" title="Keep this recording as a baseline">Pin A</button><button id="compare" disabled>Show A</button></div></div>
      <details class="measurements"><summary>Measurements</summary><output id="geometry"></output></details>
    </main>
    <aside id="inspector" class="inspector" aria-label="Preview settings" hidden>
      <div class="panel-tabs" role="tablist" aria-label="Settings"><button id="motion-tab" role="tab" aria-selected="true" aria-controls="motion-panel">Motion</button><button id="scene-tab" role="tab" aria-selected="false" aria-controls="scene-panel">Scene</button></div>
      <section id="motion-panel" role="tabpanel" aria-labelledby="motion-tab"><form id="settings"></form><div class="panel-actions"><button id="preview-settings" class="primary full" disabled>Preview</button><div class="source-actions"><button id="reset-settings" disabled>Reset</button><button id="apply" disabled>Save to source</button></div><div id="save-status" role="status"></div></div></section>
      <section id="scene-panel" role="tabpanel" aria-labelledby="scene-tab" hidden>
        <label>Search<select id="search"><option value="idle">Empty</option><option value="focused">Focused</option><option value="populated">Query</option><option value="unfocused">Retained query</option><option value="image">Image</option></select></label>
        <label>Composer<select id="composer"><option value="empty">Empty</option><option value="text">Draft</option><option value="multiline">Multiline</option><option value="running">Generating</option></select></label>
        <label>Related<select id="related"><option value="ready">Results</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="insufficient">Insufficient content</option><option value="unavailable">Unavailable</option></select></label>
        <label>Interrupt<select id="condition"><option value="normal">None</option><option value="reverse">Reverse</option><option value="retarget">Switch surface</option><option value="resize">Resize</option><option value="reduced">Reduced motion</option><option value="reduce-during">Reduce motion during</option></select></label>
        <label id="interrupt-field" hidden>At · ms<input id="interruptAt" type="number" value="160" min="0" max="3000"></label>
        <details><summary>Viewport & capture</summary><div class="pair"><label>Width<input id="width" type="number" value="1440" min="320" max="2400"></label><label>Height<input id="height" type="number" value="900" min="320" max="1600"></label></div><label>Capture · ms<input id="duration" type="number" value="1200" min="100" max="4000"></label><label>Font · px<input id="fontSize" type="number" value="16" min="12" max="24"></label><div class="pair"><label>Safe area · px<input id="safeArea" type="number" value="0" min="0" max="60"></label><label>Keyboard · px<input id="keyboardInset" type="number" value="0" min="0" max="400"></label></div></details>
        <button id="copy" class="full">Copy configuration</button>
      </section>
    </aside>
  </div>
  <dialog id="inventory-dialog"><div><h2>Inventory</h2><button id="close-inventory" aria-label="Close inventory">Close</button></div><p class="help">Scrub to inspect frames. Use Live replay to check timing and Interact to test input. Frames do not rewind app state. Native keyboard and WebKit rendering need the native app. Chat attachments are not implemented.</p><pre id="inventory-text"></pre></dialog>
  <script type="module" src="/src/lib/dev/animation-lab/panel.ts"></script>
</body></html>
